name: Clean installer checks
on:
  push:
    branches: [mini-agent-development]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: node scripts/build-installer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/*
  install:
    timeout-minutes: 15
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: downloads
      - name: Extract Unix package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unzip -q downloads/Mini-Agent-0.1.1.zip -d extracted
          mv extracted/Mini-Agent-0.1.1 bundle
      - name: Extract Windows package
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Expand-Archive downloads/Mini-Agent-0.1.1.zip extracted
          Move-Item extracted/Mini-Agent-0.1.1 bundle
      - name: Install and validate Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh bundle/install.sh --prefix "$RUNNER_TEMP/mini-agent"
          "$RUNNER_TEMP/mini-agent/bin/mini-agent" doctor
      - name: Install and validate Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./bundle/install.ps1 -Prefix "$env:RUNNER_TEMP\MiniAgent"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\MiniAgent\bin\launch.ps1" -Command doctor
          exit $LASTEXITCODE
